<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Pages公開後検証</title><style>body{max-width:1500px;margin:24px auto;padding:0 16px;background:#172027;color:#e7ece9;font:16px/1.7 system-ui}a{color:#b8d6ff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0 0 24px}img,video{display:block;width:100%;height:auto;image-rendering:pixelated}figcaption{padding:8px}@media(max-width:800px){.pair{grid-template-columns:1fr}}</style><h1>GitHub Pages公開後検証</h1><p>2026-10-25。コミット4704cefを公開後、Chromeで実際の書き出しボタンを操作し、PNGと6秒動画のダウンロードを確認しました。ローカルの代替アセットは使用していません。</p><p><a href="../../LIGHTING_DESIGN.md">詳細設計・検証結果</a> ／ <a href="browser.json">ブラウザ操作・配信一致・保存結果</a> ／ <a href="app-deployment.json">Pagesビルド</a> ／ <a href="app-files.json">配信13ファイルの照合</a></p><h2>公開環境の夕景</h2><div class="pair"><figure><img src="nagisa-sunset.png" alt="公開後のなぎさ夕景"><figcaption>なぎさ：旧方式の光の広がりを確認</figcaption></figure><figure><img src="picnic-sunset.png" alt="公開後のpicnic夕景"><figcaption>picnic：旧方式の暖かな逆光を確認</figcaption></figure></div><h2>実際に保存したPNG</h2><div class="pair"><figure><img src="nagisa-export.png" alt="公開ページから保存したなぎさPNG"><figcaption>なぎさ 1280×720</figcaption></figure><figure><img src="picnic-export.png" alt="公開ページから保存したpicnic PNG"><figcaption>picnic 1280×720</figcaption></figure></div><h2>保存後の画面</h2><div class="pair"><figure><img src="nagisa-export-ui.png" alt="なぎさ保存後のUI"><figcaption>なぎさ</figcaption></figure><figure><img src="picnic-export-ui.png" alt="picnic保存後のUI"><figcaption>picnic</figcaption></figure></div><h2>実際に保存した6秒動画</h2><div class="pair"><figure><video controls preload="metadata" src="nagisa-6s.mp4"></video><figcaption>なぎさ</figcaption></figure><figure><video controls preload="metadata" src="picnic-6s.mp4"></video><figcaption>picnic</figcaption></figure></div><p>MediaRecorderの実時間録画のため、指定秒数との差や端点フレームの完全一致は詳細設計の制限事項を参照してください。</p></html>
