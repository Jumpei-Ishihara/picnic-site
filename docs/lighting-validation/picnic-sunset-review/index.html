<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>picnic夕景：原因と切戻し</title><style>body{margin:24px auto;padding:0 16px;max-width:1800px;background:#172027;color:#e7ece9;font:16px/1.7 system-ui}a{color:#b8d6ff}.main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}figure{margin:0 0 24px}img{width:100%;height:auto;display:block;image-rendering:pixelated}figcaption{padding:8px}@media(max-width:900px){.main,.details{grid-template-columns:1fr}}</style><h1>picnic夕景：原因と切戻し</h1><p>2026-10-24。夏・18:35相当・同一カメラ・320×180描画。HUDは同じ条件で非表示。</p><p>光芒の実効強度が約11.3%に低下し、空中光も弱くなっていました。画面効果と光線設定を旧方式へ切り戻し、木漏れ日・影更新・6秒周期の修正を保持しました。</p><p><a href="../../LIGHTING_DESIGN.md#picnic夕景の確認切戻し2026-10-24">詳細設計・検証結果</a> ／ <a href="analysis.json">切り分けの数値と条件</a> ／ <a href="../regressions.json">切戻し後の回帰検証</a> ／ <a href="../index.html?review=picnic-rollback">全場面の比較</a></p><div class="main"><figure><img src="original.png" alt="改修前"><figcaption>改修前<br>環帯平均値 0.381078</figcaption></figure><figure><img src="trial.png" alt="劣化した試作"><figcaption>劣化した試作<br>環帯平均値 0.303194</figcaption></figure><figure><img src="restored.png" alt="切戻し後（木漏れ日等を保持）"><figcaption>切戻し後（木漏れ日等を保持）<br>環帯平均値 0.381282</figcaption></figure></div><h2>各処理を単独で戻した比較</h2><p>画像指標は表示RGBの環帯平均値であり、物理的な輝度や美しさの点数ではありません。</p><div class="details"><figure><img src="restore-rays.png" alt="光芒だけ戻す"><figcaption>光芒だけ戻す<br>環帯平均値 0.340522</figcaption></figure><figure><img src="restore-highlight.png" alt="明部圧縮だけ戻す"><figcaption>明部圧縮だけ戻す<br>環帯平均値 0.304150</figcaption></figure><figure><img src="restore-bloom.png" alt="ブルームだけ戻す"><figcaption>ブルームだけ戻す<br>環帯平均値 0.303195</figcaption></figure><figure><img src="restore-volume.png" alt="空中光だけ戻す"><figcaption>空中光だけ戻す<br>環帯平均値 0.339919</figcaption></figure><figure><img src="restore-rays-highlight.png" alt="光芒＋明部圧縮を戻す"><figcaption>光芒＋明部圧縮を戻す<br>環帯平均値 0.350259</figcaption></figure></div>
