<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>なぎさ夕景：原因と切戻し</title><style>body{margin:24px auto;padding:0 16px;max-width:1800px;background:#172027;color:#e7ece9;font:16px/1.7 system-ui}a{color:#b8d6ff}.main{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.details{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}figure{margin:0 0 24px}img{width:100%;height:auto;display:block;image-rendering:pixelated}figcaption{padding:8px}@media(max-width:900px){.main,.details{grid-template-columns:1fr}}</style><h1>なぎさ夕景：原因の切り分けと切戻し</h1><p>2026-10-24。同じ時刻・カメラ・夏・320×180描画。HUDは同じ条件で非表示。</p><p>光芒の減衰が重なり、試作の実効強度は元の約2.15%になっていました。なぎさの画面効果を旧方式へ戻し、木漏れ日の改善を残しました。</p><p><a href="../../SUNSET_REVIEW.md">原因分析・変更範囲・検証結果</a> ／ <a href="analysis.json">数値と条件</a> ／ <a href="../index.html?review=sunset-rollback">全場面の比較へ</a></p><div class="main"><figure><img src="original.png?v=2" alt="改修前"><figcaption>改修前<br>環帯平均値 0.531411</figcaption></figure><figure><img src="trial.png?v=2" alt="劣化した試作"><figcaption>劣化した試作<br>環帯平均値 0.408285</figcaption></figure><figure><img src="restored.png?v=2" alt="切戻し後：木漏れ日を保持"><figcaption>切戻し後：木漏れ日を保持<br>環帯平均値 0.531103</figcaption></figure></div><h2>各処理を単独で戻した比較</h2><p>画像指標は表示RGBの環帯平均値であり、美しさや物理的な輝度を表す点数ではありません。</p><div class="details"><figure><img src="restore-rays.png?v=2" alt="光芒だけ戻す"><figcaption>光芒だけ戻す<br>環帯平均値 0.495937</figcaption></figure><figure><img src="restore-highlight.png?v=2" alt="明部圧縮だけ戻す"><figcaption>明部圧縮だけ戻す<br>環帯平均値 0.411642</figcaption></figure><figure><img src="restore-bloom.png?v=2" alt="ブルームだけ戻す"><figcaption>ブルームだけ戻す<br>環帯平均値 0.408275</figcaption></figure><figure><img src="restore-volume.png?v=2" alt="空中光だけ戻す"><figcaption>空中光だけ戻す<br>環帯平均値 0.408938</figcaption></figure><figure><img src="restore-rays-highlight.png?v=2" alt="光芒＋明部圧縮を戻す"><figcaption>光芒＋明部圧縮を戻す<br>環帯平均値 0.530692</figcaption></figure></div></html>
